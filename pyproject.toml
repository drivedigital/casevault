[project]
name = "casevault"
version = "0.0.0"
description = "Legal Matter Intelligence workspace — local-first, evidence-centered monorepo"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# Repo root (workers.*) and the FastAPI app root (app.*) are both importable.
pythonpath = [".", "apps/api"]
testpaths = ["tests"]
