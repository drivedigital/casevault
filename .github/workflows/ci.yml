# CaseVault CI — Phase 0 skeleton.
# Python job runs the real smoke tests; web job proves the scaffold builds;
# secrets job guards the evidence-local repo posture. Expand per-module as
# features land (see handoff/BACKLOG.md).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casevault_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/casevault_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/casevault_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check apps workers scripts tests
      - name: Verify migrations apply to a fresh database
        working-directory: apps/api
        run: alembic upgrade head
      - run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=web
      - run: npm run typecheck --workspace=web
      - run: npm run build --workspace=web

  secrets:
    # Secret scanning protects the local-first evidence posture: no API keys
    # or evidence-adjacent files should ever enter history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        # gitleaks-action needs a token to fetch the baseline config/annotations.
        # The automatic Actions token is sufficient here; no personal token or
        # new repository secret is introduced by this change.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  intake:
    # W2-J: Wave 2 intake end-to-end verification (contract
    # docs/contracts/wave2_intake_core.md v1.0). Additive job — it appends to the
    # existing python/web/secrets jobs and changes none of them (the secrets job
    # is WS-D's; this workstream never restructures CI).
    #
    # INTAKE_REQUIRE=1 makes this job fail-closed: a missing migration, table or
    # router is a failure, never a skip — a green run here means the intake
    # surface really was verified. INTAKE_ALLOW_APP_DB=1 acknowledges that both
    # URLs point at this job's disposable postgres:16 service container.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casevault_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/casevault_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/casevault_ci
      INTAKE_REQUIRE: "1"
      INTAKE_ALLOW_APP_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Verify migrations apply to a fresh database
        working-directory: apps/api
        run: alembic upgrade head
      - name: Verifier guard rails (fail-closed, redaction, scoped cleanup)
        run: pytest tests/integration/test_intake_e2e_guards.py -v
      - name: Intake end-to-end integration test (fail-closed)
        run: pytest tests/integration/test_intake_e2e.py -v
      - name: Intake headless smoke script
        run: python scripts/intake_smoke.py --require-intake

  evidence:
    # WS-D: independent HTTP + worker + storage proof; existing jobs stay intact.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casevault_evidence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casevault_evidence_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/casevault_evidence_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/casevault_evidence_ci
      # Even an absent binary/storage prerequisite must fail this required job.
      EVIDENCE_REQUIRE_DEPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install the private Redis server binary
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Apply migrations to PostgreSQL 16
        run: python -m alembic -c apps/api/alembic.ini upgrade head
      - name: Verify evidence end-to-end (no skipped scenarios)
        run: |
          set -o pipefail
          mkdir -p data/diagnostics
          python -m pytest -q -rA -s tests/integration/test_evidence_e2e.py \
            --junitxml=data/diagnostics/evidence-junit.xml \
            2>&1 | tee data/diagnostics/evidence.log
      - name: Publish verification output only (never uploaded files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-verification
          path: |
            data/diagnostics/evidence.log
            data/diagnostics/evidence-junit.xml
          if-no-files-found: warn
          retention-days: 7
